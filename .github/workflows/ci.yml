# 持续校验（CI）：每次 push 与 PR 自动运行，只做校验，不产出任何制品。
#
# 与 release.yml 的分工：
#   ci.yml      —— 自动触发，快速反馈。不推镜像、不打 tag、不建 Release。
#   release.yml —— 仅手动触发，负责真实发版。
#
# 为什么需要它：受管运行时等大量测试用 t.Skip 跳过 Windows（依赖符号链接、
# Unix 执行位、/bin/sh 夹具），开发机跑 go test 看不出问题。没有自动 CI 时，
# 这类回归只能在手动发版时才暴露。
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# 同一分支的新 push 取消仍在进行的旧运行，避免排队浪费。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: 后端校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

      - name: gofmt 格式检查（仅警告）
        continue-on-error: true
        run: |
          unformatted="$(gofmt -l . | grep -v '^web/node_modules/' || true)"
          if [ -n "$unformatted" ]; then
            echo "::warning::以下文件未通过 gofmt 格式检查："
            echo "$unformatted"
          else
            echo "gofmt 格式检查通过。"
          fi

  frontend:
    name: 前端校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 依赖安装
        working-directory: ./web
        run: npm ci

      - name: ESLint
        working-directory: ./web
        run: npm run lint

      - name: 单元测试
        working-directory: ./web
        run: npm run test:unit

      # 含 vue-tsc 类型检查，能拦住只在类型层面出现的破坏。
      - name: 构建
        working-directory: ./web
        run: npm run build

  # 镜像只在 release.yml 里手动构建，Dockerfile 的破坏（apt 源、Node tarball 与校验和、
  # PATH 顺序、内置工具自检）过去只能在发版那一刻才暴露。这里在每次 push 上单架构
  # 试构建一次并且不推送，把这类失败提前到提交时。
  images:
    name: 镜像构建校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # Dockerfile 只负责打包，二进制由 release.yml 的编译产物提供。这里只验证
      # Dockerfile 自身，用占位文件顶替即可，不必在 CI 里重复一次交叉编译。
      - name: 准备占位二进制
        run: |
          mkdir -p bin
          printf '#!/bin/sh\nexit 0\n' > bin/mpg-linux-amd64
          chmod +x bin/mpg-linux-amd64

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: 构建默认镜像（不推送）
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false

      - name: 构建精简镜像（不推送）
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.slim
          platforms: linux/amd64
          push: false

# GitHub Action 发布流水线
#
# 触发方式：仅手动触发（workflow_dispatch），不在 push/tag 时自动发版。
#
# 构建策略（编译在 Actions 中完成，Dockerfile 仅做打包）：
#   1) quality         —— 质量门禁：go vet、go test、前端 ESLint、gofmt 格式检查。
#   2) version         —— 生成日期版本号 1.0.<YYYYMMDDHHmm>（北京时间）。
#   3) build-frontend   —— 独立构建前端并上传 artifact。
#   4) build-backend   —— 矩阵并行编译 amd64/arm64 后端二进制（依赖前端 artifact）。
#   5) docker          —— 精简镜像 Dockerfile → :latest / :<version>（无 Node/Python）。
#   6) docker-full     —— 完整镜像 Dockerfile.full → :full / :<version>-full（内置 Node/Python）。
#   7) release         —— 自动打 git tag 并创建 GitHub Release。
#
# 约定写死的固定值（无需环境变量/密钥）：
#   - 镜像仓库：Docker Hub
#   - 镜像名称：xylplm/mcp-proxy-gateway
# 需要在仓库 Secrets 中配置的凭据（敏感，不可写死）：
#   - DOCKERHUB_USERNAME：Docker Hub 用户名
#   - DOCKERHUB_TOKEN：Docker Hub 访问令牌
name: release

on:
  workflow_dispatch:

permissions:
  contents: write # 创建 tag 与 Release 需要写权限

env:
  IMAGE_NAME: xylplm/mcp-proxy-gateway
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ===========================================================================
  # 质量门禁：发版前的前端 / 后端校验，任一失败即中止后续全部任务。
  # ===========================================================================
  quality:
    name: 质量门禁
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: 前端依赖安装
        working-directory: ./web
        run: npm ci

      - name: 前端 ESLint 校验（仅警告，不阻断发版）
        continue-on-error: true
        working-directory: ./web
        run: npm run lint

      - name: 后端 go vet
        run: go vet ./...

      - name: 后端 gofmt 格式检查（仅警告，不阻断发版）
        continue-on-error: true
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::warning::以下文件未通过 gofmt 格式检查（仅提示，不阻断发版）："
            echo "$unformatted"
          else
            echo "gofmt 格式检查通过。"
          fi

      - name: 后端测试
        run: go test ./...

  # ===========================================================================
  # 版本号：生成 1.0.<北京时间 YYYYMMDDHHmm>，供后续任务共享。
  # ===========================================================================
  version:
    name: 生成版本号
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: 生成日期版本号
        id: ver
        run: |
          VERSION="1.0.$(TZ=Asia/Shanghai date +%Y%m%d%H%M)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "生成版本号：${VERSION}（tag v${VERSION}）"

  # ===========================================================================
  # 前端构建：独立完成前端编译并上传 artifact，供后端 job 下载。
  # ===========================================================================
  build-frontend:
    name: 构建前端
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 前端依赖安装
        working-directory: ./web
        run: npm ci

      - name: 写入版本号到 package.json
        working-directory: ./web
        run: npm version --no-git-tag-version "${VERSION}"

      - name: 构建前端
        working-directory: ./web
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ needs.version.outputs.version }}

      - name: 上传前端产物
        uses: actions/upload-artifact@v5
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1

  # ===========================================================================
  # 后端构建：矩阵并行编译 amd64/arm64，下载前端 artifact 后内嵌编译。
  # ===========================================================================
  build-backend:
    name: 编译后端 (${{ matrix.arch }})
    needs: [version, build-frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 下载前端产物
        uses: actions/download-artifact@v5
        with:
          name: web-dist
          path: web/dist/

      - name: 安装 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Go 依赖下载
        run: go mod download

      - name: 复制前端产物到 embed 目录
        run: rm -rf internal/static/dist/* && cp -r web/dist/* internal/static/dist/

      - name: 交叉编译 linux/${{ matrix.arch }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
            go build -trimpath -ldflags="-s -w -X 'main.version=${VERSION}'" \
            -o ./bin/mpg-linux-${{ matrix.arch }} ./cmd/gateway

      - name: 上传后端二进制
        uses: actions/upload-artifact@v5
        with:
          name: bin-${{ matrix.arch }}
          path: bin/
          retention-days: 1

  # ===========================================================================
  # Docker 精简版：默认 :latest / :<version>（无 Node/Python）。
  # ===========================================================================
  docker:
    name: 构建并推送精简版镜像
    needs: [version, build-backend]
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 下载 amd64 二进制
        uses: actions/download-artifact@v5
        with:
          name: bin-amd64
          path: bin/

      - name: 下载 arm64 二进制
        uses: actions/download-artifact@v5
        with:
          name: bin-arm64
          path: bin/

      - name: 准备 Docker 构建上下文
        run: cp entrypoint.sh bin/

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.title=MCP Proxy Gateway
            org.opencontainers.image.description=Slim gateway image without Node/Python (install via admin Runtime or volume)
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/xylplm/mcp-proxy-gateway
            org.opencontainers.image.revision=${{ github.sha }}

  # ===========================================================================
  # Docker 完整版：:full / :<version>-full（内置 Node.js / npm / Python3）。
  # 不覆盖 :latest，默认仍为精简版。apk 多架构安装依赖 QEMU。
  # ===========================================================================
  docker-full:
    name: 构建并推送完整版镜像
    needs: [version, build-backend]
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 下载 amd64 二进制
        uses: actions/download-artifact@v5
        with:
          name: bin-amd64
          path: bin/

      - name: 下载 arm64 二进制
        uses: actions/download-artifact@v5
        with:
          name: bin-arm64
          path: bin/

      - name: 准备 Docker 构建上下文
        run: |
          chmod +x bin/mpg-linux-* || true
          ls -lh bin/

      - name: Docker Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push full Docker images
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.full
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.version.outputs.version }}-full
            ${{ env.IMAGE_NAME }}:full
          labels: |
            org.opencontainers.image.title=MCP Proxy Gateway (Full)
            org.opencontainers.image.description=Full gateway image with Node.js and Python3 for local stdio MCPs
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/xylplm/mcp-proxy-gateway
            org.opencontainers.image.revision=${{ github.sha }}

  # ===========================================================================
  # 发布：镜像推送成功后，自动打 git tag 并创建 GitHub Release。
  # ===========================================================================
  release:
    name: 打 tag 并发布 Release
    needs: [version, docker, docker-full]
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 打 git tag 并创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            自动发布版本 `${{ needs.version.outputs.version }}`。

            多架构 Docker 镜像（linux/amd64、linux/arm64）：

            **精简版（默认，无 Node/Python）**
            - `xylplm/mcp-proxy-gateway:${{ needs.version.outputs.version }}`
            - `xylplm/mcp-proxy-gateway:latest`

            **完整版（内置 Node.js / npm / Python3）**
            - `xylplm/mcp-proxy-gateway:${{ needs.version.outputs.version }}-full`
            - `xylplm/mcp-proxy-gateway:full`

            拉取示例：
            ```bash
            # 默认精简
            docker pull xylplm/mcp-proxy-gateway:${{ needs.version.outputs.version }}
            # 本地 stdio 开箱即用
            docker pull xylplm/mcp-proxy-gateway:full
            ```
